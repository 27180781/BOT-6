<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>ניהול הבוט</title>
</head>
<body>
    <h2>ניהול פרטי העסק והבוט</h2>
    <form action="/save_config" method="POST">
        שם העסק: <input type="text" name="business_name" value="{{ config.business_name }}"><br><br>
        תיאור העסק: <input type="text" name="business_description" value="{{ config.business_description }}"><br><br>
        קישור למרכז ידע: <input type="text" name="knowledge_base_link" value="{{ config.knowledge_base_link }}"><br><br>
        מודל AI: 
        <select name="model">
            <option value="gpt-3.5-turbo" {% if config.model == 'gpt-3.5-turbo' %}selected{% endif %}>gpt-3.5-turbo</option>
            <option value="gpt-4" {% if config.model == 'gpt-4' %}selected{% endif %}>gpt-4</option>
        </select><br><br>
        טמפרטורה (0.0 עד 1.0): <input type="text" name="temperature" value="{{ config.temperature }}"><br><br>
        <button type="submit">שמור</button>
    </form>
</body>
</html>
