<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>צ'אטבוט בינה מלאכותית</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; direction: rtl; }
        #chat { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; background: #f9f9f9; }
        input, button { padding: 10px; margin-top: 10px; width: 80%; }
        button { width: 18%; }
        .user { text-align: right; color: blue; }
        .bot { text-align: left; color: green; }
    </style>
</head>
<body>
    <h1>צ'אטבוט GPT</h1>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="כתוב הודעה...">
    <button onclick="send()">שלח</button>

    <script>
        async function send() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const message = input.value;
            if (!message) return;

            chat.innerHTML += `<div class='user'><b>אתה:</b> ${message}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            chat.innerHTML += `<div class='bot'><b>בוט:</b> ${data.reply}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
